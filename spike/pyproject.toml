[project]
name = "reading-tutor-speed-spike"
version = "0.0.0"
description = "Throwaway speed and memory spike for local Bulgarian STT engines. Never imported by the app."
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "transformers",
    "torch",
    "soundfile",
    "numpy",
    "onnx-asr[cpu,hub]",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
